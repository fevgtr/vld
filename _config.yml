# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html

# Site
title: Virtual Learning Development
subtitle: 'Data Structures & Algorithms in C++'
description: 'My VLD learning journal: working through Tsinghua University''s Data Structures course in C++.'
keywords: VLD, data structures, algorithms, C++, KCIS
author: 103PA
language: en
timezone: 'Asia/Taipei'

# URL
url: https://fevgtr.github.io/vld
root: /vld/
permalink: journal/:year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: journal
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
theme: fluid

# Deployment
deploy:
  type: git
  repo: https://github.com/fevgtr/vld.git
  branch: gh-pages
